name: Feature Request
description: Suggest a new capability or improvement for Pilot Puppy.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Pilot Puppy does this affect?
      options:
        - Core plan and brief (PLAN.md / SKILL.md / docs/reference/plan-fields.md)
        - CLI commands (init, status, browse, checkpoint, roster, route, host, doctor)
        - Native-host handoff (route / host)
        - Local roster and routing
        - Documentation (guides, README, examples)
        - CI / testing
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What workflow is missing, slow, or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Pilot Puppy solve this? Concrete examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try or think about?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links to other tools that do this well, etc.
    validations:
      required: false
